{% extends "inventory_client/base.html" %}
{% block content %}
<h2>Eliminar producto</h2>
<p>¿Seguro que deseas eliminar <strong>{{ p.nombre }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Sí, eliminar</button>
  <a href="{% url 'inventory_client:product_detail' p.id %}">Cancelar</a>
</form>
{% endblock %}
